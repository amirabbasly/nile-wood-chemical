name: Server probe

on:
  push:
    branches: ["arena/6171edff-nile-wood-chemical"]
    paths:
      - "deploy/probe.txt"

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Probe server
        run: |
          set +e
          {
            echo "host_len=${#SERVER_HOST} user_len=${#SERVER_USER} pass_len=${#SERVER_PASSWORD} port=${SERVER_PORT:-22}"
          } > deploy/probe-output.txt
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_PASSWORD" ]; then
            echo "SECRETS_MISSING" >> deploy/probe-output.txt
          else
            sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "bash -s" \
              < deploy/probe-remote.sh >> deploy/probe-output.txt 2>&1
            echo "ssh exit=$?" >> deploy/probe-output.txt
          fi
      - name: Commit probe output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add deploy/probe-output.txt
          git commit -m "Probe result" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:${{ github.ref_name }}
